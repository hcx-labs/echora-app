minimum_pre_commit_version: '4.0.0'
# Vendored research code follows its upstream: neither formatted nor linted.
exclude: '(^|/)vendor/'
# pre-commit preserves unstaged edits while formatting the staged version.
repos:
  - repo: local
    hooks:
      - id: prettier-typescript
        name: Format TypeScript with Prettier
        entry: node_modules/.bin/prettier --write
        language: system
        types_or: [ts, tsx]
        exclude: '(^|/)(next-env\.d\.ts|dist/|build/|node_modules/|\.next/)'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      # Each file takes its nearest Ruff config: ruff.toml at the root.
      - id: ruff-format
