[project]
name = "echora-analysis"
version = "0.1.9"
description = "Reproducible music embedding and evaluation worker"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "Authlib==1.7.2",
  "beartype==0.22.9",
  "cryptography==50.0.0",
  "einops==0.8.2",
  "essentia==2.1b6.dev1389",
  "onnxruntime==1.23.2",
  "fastapi==0.141.1",
  "fasttext-wheel==0.9.2",
  "httpx==0.28.1",
  "openai==3.19.2",
  "huggingface-hub==1.28.0",
  "igraph==1.0.0",
  "itsdangerous==2.2.0",
  "jaconv==0.4.0",
  "Janome==0.5.0",
  "librosa==0.11.0",
  # Optional offload of model computation (docs/modal-compute.md).
  "modal==1.6.0",
  "muq==0.1.0",
  "nltk==3.9.1",
  "numba==0.67.0",
  "numpy==2.5.2",
  # Shared lyric normalizer (vendor/fa_kara/script_romanization.py): Mandarin, Cantonese, Thai.
  "OpenCC==1.4.2",
  "ToJyutping==3.2.0",
  "pythainlp==5.4.0",
  # Label rules v2 and later (vendor/fa_kara/label_rules.py; v3-sung is the default): en/de/fr
  # pronunciation labels via espeak-ng (apt package in docker/Dockerfile.*; GPL-3.0, phonemizer GPL-3.0)
  # and number words (num2words, LGPL-2.1). Imported lazily: v1 never loads them.
  "num2words==0.5.14",
  "phonemizer==3.4.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "pykakasi==2.3.0",
  "pyphen==0.17.2",
  "pypinyin==0.55.0",
  "pyyaml==6.0.3",
  "redis==7.1.0",
  # Roformer checkpoint's original rotary implementation; avoid silently changing its math.
  "rotary-embedding-torch==0.3.5",
  "scikit-learn==1.9.0",
  "soundfile==0.13.1",
  "soxr==1.1.0",
  "sentence-transformers==6.0.0",
  "SQLAlchemy==2.0.52",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "transformers==5.15.1",
  "uroman==1.3.1.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echora_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
